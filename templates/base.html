{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        La Carthagenoise - Poterie Tunisienne
      {% endblock %}
    </title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="{% url 'catalogue:liste_produits' %}">La Carthagenoise</a>
        {% comment %} <a href="{% url 'view_devis' %}" class="btn btn-outline-success my-2 my-sm-0">Liste de Devis (0)</a> {% endcomment %}
      </nav>
    </header>

    <main class="container mt-4">
      {% block content %}

      {% endblock %}
    </main>

    <footer class="text-center mt-5 py-3 bg-light">
      ©{% now 'Y' %}La Carthaginoise. Tous droits réservés.
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
