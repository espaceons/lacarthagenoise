{% extends 'base.html' %}

{% block title %}Supprimer le produit - La Carthagenoise{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="card-body">
                <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
                <h3 class="fw-bold mb-3">Confirmer la suppression</h3>
                <p class="text-muted mb-4">
                    Êtes-vous sûr de vouloir supprimer définitivement le produit <strong>"{{ produit.nom }}"</strong> ?
                </p>

                <form method="post" class="d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <a href="{% url 'catalogue:admin_produits' %}" class="btn btn-outline-secondary">Annuler</a>
                    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
